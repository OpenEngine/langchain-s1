[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-s1"
version = "0.2.0"
description = "A langchain wrapper for s1 decisions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24,<1",
    "langchain-core>=0.3,<2",
]

[project.optional-dependencies]
test = ["pytest>=7", "langgraph>=0.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_s1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
